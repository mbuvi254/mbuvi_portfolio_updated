{% extends 'admin/security_form_base.html' %}{% block form_content %}<h1>Choose a new password.</h1>{% if error %}<p class="auth-alert" role="alert">{{ error }}</p>{% endif %}<form method="post">{% if csrf_token is defined %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}<label for="new_password">New password (12–200 characters)</label><input id="new_password" type="password" name="new_password" minlength="12" maxlength="200" autocomplete="new-password" required><label for="confirm_password">Repeat password</label><input id="confirm_password" type="password" name="confirm_password" minlength="12" maxlength="200" autocomplete="new-password" required>{% if factor %}<label for="code">Authenticator or recovery code</label><input id="code" name="code" autocomplete="one-time-code" required>{% endif %}<button class="sign-in-button">Update password →</button></form>{% endblock %}
