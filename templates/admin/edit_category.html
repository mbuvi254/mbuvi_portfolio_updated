{% extends 'admin/base.html'%}
{% block content %}
<div class="card card-secondary">
    <div class="card-header">
        <h6>{{ptitle}}</h6>
    </div>
<div class="card-body">
    {% if category :  %}
<form action="/dashboard/category/edit/{{category[0]}}" method="POST">{% if csrf_token is defined %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}
    <div class="form-group">
    <label for="description">Title</label>
    <input type="text" name="title" class="form-control" id="title" value="{{category[1]}}" required>
    </div>
    <div class="form-group">
    <label for="description">Description</label>
    <textarea class="form-control" name="details" id="details" rows="3" value="{{category[2]}}" required>{{category[2]}}</textarea>
    </div>
</div>
<button type="submit" class="btn btn-primary btn-block">Edit Category</button>
</form>
{% endif %}
</div>

{% endblock %}
