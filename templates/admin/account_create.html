{% extends 'admin/base.html' %}{% block content %}<section class="analytics-panel feature-editor"><p>Only signed-in administrators can create accounts. New accounts must set up their own authenticator.</p>{% if error %}<p class="alert alert-warning" role="alert">{{ error }}</p>{% endif %}<form method="post">{% if csrf_token is defined %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}<label>First name<input name="firstName" required maxlength="120"></label><label>Last name<input name="lastName" required maxlength="120"></label><label>Email<input type="email" name="email" required maxlength="254"></label><label>Phone<input type="tel" name="phone" maxlength="30"></label><label>Initial password<input type="password" name="password" required minlength="12" maxlength="200" autocomplete="new-password"></label><button class="btn btn-primary">Create administrator</button></form></section>{% endblock %}
