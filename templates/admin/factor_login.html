{% extends 'admin/security_form_base.html' %}{% block form_content %}<h1>Verify your sign-in.</h1><p>Enter the current code from your authenticator, or a one-use recovery code.</p>{% if error %}<p class="auth-alert" role="alert">{{ error }}</p>{% endif %}<form method="post">{% if csrf_token is defined %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}<label for="code">Authenticator or recovery code</label><input id="code" name="code" autocomplete="one-time-code" required autofocus maxlength="20"><button class="sign-in-button">Verify and continue →</button></form><a href="/dashboard/login">Back to sign in</a>{% endblock %}
