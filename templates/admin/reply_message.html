{% extends 'admin/base.html'%}
{% block content %}

{% if mes: %}
<div class="container">
    <div class="row">
      <div class="col-md-12">
        <h2>{{ptitle}}</h2>
        <hr>
        <div class="card">
          <div class="card-body">
            <form action='/dashboard/message/reply/{{mes[0]}}' method='POST'>{% if csrf_token is defined %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}
              <div class="mb-3">
                <label for="recipient" class="form-label">To:</label>
                <input type="email" class="form-control" id="email" name="email" value="{{mes[3]}}" placeholder="Enter recipient email" required>
              </div>
              <div class="mb-3">
                <label for="subject" class="form-label">Subject:</label>
                <input type="text" class="form-control" name="subject" id="subject" value="{{mes[4]}}" placeholder="Enter subject" required>
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Message:</label>
                <textarea class="form-control" id="message" name="message" rows="5" placeholder="Enter your message" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Send</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  {% endif %}


{% endblock%}
