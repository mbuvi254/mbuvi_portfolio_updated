{% extends 'admin/security_form_base.html' %}{% block form_content %}<h1>Reset your password.</h1><p>Request a one-use reset link. It expires after 30 minutes.</p>{% if notice %}<p class="auth-alert" role="status">{{ notice }}</p>{% endif %}<form method="post">{% if csrf_token is defined %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}<label for="email">Account email</label><input type="email" id="email" name="email" autocomplete="username" required><button class="sign-in-button">Request reset link →</button></form><a href="/dashboard/login">Back to sign in</a>{% endblock %}
