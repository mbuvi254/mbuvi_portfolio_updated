{% extends 'admin/base.html'%}
{% block content %}
<div class="card card-secondary">
    <div class="card-header">
        <h6>Add About</h6>
    </div>
<div class="card-body">
<form action="/dashboard/about/add" method="POST" enctype="multipart/form-data">{% if csrf_token is defined %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}
    <div class="form-group">
        <label for="description">Project Image</label>
        <input type="file" name="file" class="form-control" id="file" required>
    </div>
    <div class="form-group">
    <label for="description">Title</label>
    <input type="text" name="title" class="form-control" id="title" required>
    </div>
    <div class="form-group">
    <label for="description">Description</label>
    <textarea class="form-control" name="details" id="details" rows="3" required></textarea>
    </div>
</div>

    <button type="submit" class="btn btn-primary btn-block">Add About</button>

</form>
</div>

{% endblock %}
