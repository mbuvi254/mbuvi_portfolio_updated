<article class="card" data-category="{{ project.category|lower }}"><a class="project-image" href="/project/{{ project.id }}"><img src="{{ project.image }}" alt="{{ project.title }} application screenshot" loading="lazy"></a><div class="card-body"><div class="meta"><a href="/project/category/{{ project.category_id }}">{{ project.category }}</a><span>{{ project.date }}</span></div><h3><a href="/project/{{ project.id }}">{{ project.title }}</a></h3><p>{{ project.summary }}</p><a class="textlink" href="/project/{{ project.id }}">View project ↗</a></div></article>
